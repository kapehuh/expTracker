# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [ main, master, configurationStage1 ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # разрешение на запись в репозиторий (для пуша в gh-pages)
      pages: write      # если используете GitHub Pages
      id-token: write   # для деплоя Pages
    # Передаем секреты как переменные окружения для всей job
    env:
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
      VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
      VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET }}
      VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID }}
      VITE_APP_ID: ${{ secrets.VITE_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # На этом этапе переменные окружения уже будут доступны
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages