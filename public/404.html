<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Перенаправление...</title>
    <script>
      // Сохраняем полный путь, включая подпапку репозитория
      var redirect = location.href;
      // Извлекаем базовый путь (например, /expTracker/)
      var basePath = location.pathname.split('/').slice(0, 2).join('/') + '/';
      sessionStorage.setItem('redirect', redirect);
      // Редирект на index.html внутри базового пути
      location.replace(basePath + 'index.html');
    </script>
  </head>
  <body></body>
</html>
